<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoActivity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">A</div>
      <div>
        <h1>AutoActivity</h1>
        <p>Keyboard & mouse automation</p>
      </div>
    </header>

    <section class="card">
      <h2>Timer Settings</h2>

      <label>Interval</label>
      <div class="row">
        <input id="interval" type="number" min="0.1" step="0.1" value="5">
        <select id="unit">
          <option value="seconds">Seconds</option>
          <option value="minutes" selected>Minutes</option>
          <option value="hours">Hours</option>
        </select>
      </div>

      <label>Action</label>
      <select id="action">
        <!-- <option value="shift" selected>Press Shift</option>
        <option value="ctrl">Press Ctrl</option>
        <option value="alt">Press Alt</option>
        <option value="space">Press Space</option>
        <option value="enter">Press Enter</option> -->
        <option value="f15" selected>Press F15</option>
        <option value="mouse">Move Mouse</option>
        <!-- <option value="custom">Custom Key</option> -->
      </select>

      <div id="customKeyRow" hidden>
        <label>Custom key</label>
        <input id="customKey" type="text" maxlength="15" placeholder="e.g. a, f6, tab">
      </div>

      <p id="actionHint" class="hint">>Press F15</p>
    </section>

    <section class="card status-card">
      <div class="status-line">
        <span>Status</span>
        <strong id="statusText" class="status stopped">Stopped</strong>
      </div>

      <div class="countdown" id="countdown">Not running</div>
      <div class="next-label">Time until next action</div>
    </section>

    <div class="buttons">
      <button id="startBtn" class="primary">START</button>
      <button id="stopBtn" class="danger" disabled>STOP</button>
    </div>

    <button id="testBtn" class="secondary">Test Action Now</button>

    <footer>
      The selected action is sent to the currently active Windows application.
      Use automation only where it is permitted.
    </footer>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
